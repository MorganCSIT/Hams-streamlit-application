name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "**.py"
      - "requirements.txt"
      - "WebfleetTools.spec"
      - ".streamlit/**"
      - "Scripts/**"
      - "Templates/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm WebfleetTools.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist\Application Audit RDA et Trajets.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not created: $exe"
          }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Smoke-test application
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\Application Audit RDA et Trajets.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $healthy = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
                # The packaged app can take a while to unpack and start.
              }
            }
            if (-not $healthy) {
              throw "The executable did not become healthy within 60 seconds."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Application-Audit-RDA-et-Trajets-Windows
          path: dist/Application Audit RDA et Trajets.exe
          if-no-files-found: error
